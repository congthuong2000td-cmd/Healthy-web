<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthTrack - Your Health Dashboard</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- Floating Toast Message (Error / Success) -->
    <div id="floatingToast" class="floating-toast" role="alert">
        <i class="fa-solid fa-circle-exclamation me-2 fs-5" id="toastIcon"></i>
        <span id="toastText">Error occurred!</span>
    </div>

    <!-- Header Navigation -->
    <header class="header sticky-top py-2 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            
            <!-- Logo -->
            <div class="logo-container d-flex align-items-center" style="cursor: pointer;" onclick="navigateToPage('home')">
                <div class="logo-icon bg-primary text-white me-2">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <h1 class="logo-text m-0 text-dark fw-bold fs-4 d-none d-sm-block" data-translate="app_title">HealthTrack</h1>
            </div>

            <!-- SPA Nav Pills -->
            <nav class="nav nav-pills d-flex align-items-center">
                <a class="nav-link active" href="#home" onclick="event.preventDefault(); navigateToPage('home');" data-translate="nav_home">Home</a>
                <a class="nav-link" href="#calculator" onclick="event.preventDefault(); navigateToPage('calculator');" data-translate="nav_calc">BMI Calculator</a>
                <a class="nav-link" href="#tracker" onclick="event.preventDefault(); navigateToPage('tracker');" data-translate="nav_tracker">Daily Tracker</a>
            </nav>

            <!-- Settings / Utilities Toggle -->
            <div class="d-flex align-items-center gap-2">
                <!-- Theme Switcher Button -->
                <button class="btn-control" id="themeToggle" title="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>

                <!-- Language Toggle Button -->
                <button class="btn-control px-2" id="langToggle" title="Toggle language" style="width: auto; border-radius: 20px;">
                    VN
                </button>

                <!-- Profile Badge -->
                <div class="profile-badge" title="User Profile">
                    JD
                </div>
            </div>

        </div>
    </header>

    <main id="pageContainer"></main>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom SPA & Logic JS -->
    <script src="../script.js"></script>
</body>
</html>
